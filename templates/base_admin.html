<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin SPK Saham - {% block title %}Dashboard{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f7fafc; }
        .sidebar { min-height: 100vh; background: #2d3748; color: white; padding: 20px 0; position: sticky; top: 0; }
        .sidebar .brand { font-size: 1.3rem; font-weight: 700; padding: 0 20px 20px 20px; border-bottom: 1px solid #4a5568; margin-bottom: 20px; }
        .sidebar .brand i { color: #63b3ed; }
        .sidebar a { color: #cbd5e0; text-decoration: none; display: block; padding: 10px 20px; border-radius: 8px; margin: 2px 10px; font-size: 14px; }
        .sidebar a:hover, .sidebar a.active { background: #4a5568; color: white; }
        .sidebar a i { width: 24px; margin-right: 10px; }
        .sidebar .logout { border-top: 1px solid #4a5568; margin-top: 20px; padding-top: 20px; }
        .main-content { padding: 20px 30px; }
        .stat-card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .stat-number { font-size: 2.2rem; font-weight: 700; color: #2d3748; }
        .stat-label { color: #718096; font-size: 14px; }
        .stat-icon { font-size: 2.5rem; opacity: 0.3; }
        .admin-navbar { background: white; padding: 15px 0; border-bottom: 1px solid #e2e8f0; margin-bottom: 20px; }
        .admin-navbar h4 { margin: 0; font-weight: 600; }
        .badge-admin { background: #48bb78; color: white; padding: 5px 12px; border-radius: 20px; font-size: 12px; }
        .card-shadow { box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- SIDEBAR -->
            <div class="col-md-2 sidebar d-none d-md-block">
                <div class="brand"><i class="fas fa-chart-line me-2"></i>SPK Admin</div>

                <a href="{% url 'dashboard:dashboard' %}" class="{% if active == 'dashboard' %}active{% endif %}">
                    <i class="fas fa-tachometer-alt"></i> Dashboard
                </a>
                <a href="{% url 'dashboard:upload_csv' %}" class="{% if active == 'upload' %}active{% endif %}">
                    <i class="fas fa-file-csv"></i> Upload CSV
                </a>
                <a href="{% url 'dashboard:kelola_saham' %}" class="{% if active == 'saham' %}active{% endif %}">
                    <i class="fas fa-database"></i> Kelola Saham
                </a>
                <a href="{% url 'dashboard:kelola_sektor' %}" class="{% if active == 'sektor' %}active{% endif %}">
                    <i class="fas fa-tags"></i> Kelola Sektor
                </a>
                <a href="{% url 'dashboard:kriteria_pairwise' %}" class="{% if active == 'kriteria' %}active{% endif %}">
                    <i class="fas fa-sliders-h"></i> Kriteria & Pairwise
                </a>
                <a href="{% url 'dashboard:proses_analisis' %}" class="{% if active == 'analisis' %}active{% endif %}">
                    <i class="fas fa-cogs"></i> Proses Analisis
                </a>
                <a href="{% url 'dashboard:hasil_ranking' %}" class="{% if active == 'hasil' %}active{% endif %}">
                    <i class="fas fa-list"></i> Hasil Ranking
                </a>
                <a href="{% url 'dashboard:riwayat' %}" class="{% if active == 'riwayat' %}active{% endif %}">
                    <i class="fas fa-history"></i> Riwayat
                </a>
                <a href="{% url 'dashboard:api_info' %}" class="{% if active == 'api' %}active{% endif %}">
                    <i class="fas fa-plug"></i> Integrasi API
                </a>

                <div class="logout">
                    <a href="{% url 'dashboard:logout' %}" class="text-danger">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </a>
                </div>
            </div>

            <!-- MAIN CONTENT -->
            <div class="col-md-10 main-content">
                <div class="admin-navbar d-flex justify-content-between align-items-center">
                    <h4>{% block page_title %}Dashboard{% endblock %}</h4>
                    <span class="badge-admin"><i class="fas fa-user-circle me-1"></i> Admin</span>
                </div>
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
