{% extends 'base.html' %}
{% block title %}Login Admin{% endblock %}
{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height:80vh;">
    <div class="card shadow-sm" style="width:400px;"><div class="card-body p-4">
        <div class="text-center mb-4"><i class="fas fa-chart-line fa-3x text-primary"></i><h4>Login Admin</h4><p class="text-muted">SPK Pemilihan Saham Fuzzy AHP</p></div>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3"><label class="form-label">Username</label><input type="text" name="username" class="form-control"></div>
            <div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control"></div>
            <button type="submit" class="btn btn-primary w-100"><i class="fas fa-sign-in-alt me-2"></i> Masuk</button>
        </form>
        {% if error %}<div class="alert alert-danger mt-3">{{ error }}</div>{% endif %}
    </div></div>
</div>
{% endblock %}
